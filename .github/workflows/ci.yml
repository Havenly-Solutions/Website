name: CI/CD Pipeline

on:
  push:
    branches: [ main, feature, 'feature/*' ]
  pull_request:
    branches: [ main, feature ]

jobs:
  build-and-test:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Typecheck
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.havenly.solutions
          BACKEND_API_URL: https://api.havenly.solutions
